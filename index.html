<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd166'/%3E%3C/svg%3E" />
    <title>三消小游戏 · 8 关</title>
  </head>
  <body>
    <div id="app">
      <div id="fallback" class="fallback hidden" role="alert">
        <h1>无法启动游戏</h1>
        <p>当前浏览器不支持 Canvas 2D，请使用较新版本的 Chrome、Edge、Firefox 或 Safari。</p>
      </div>

      <main id="stage">
        <canvas id="game" aria-label="游戏棋盘"></canvas>

        <section id="screen-level-select" class="screen" aria-label="关卡选择"></section>

        <section id="screen-game" class="screen screen-game hidden" aria-label="对局">
          <header id="hud" class="hud">
            <div class="hud-item"><span class="hud-label">分数</span> <span id="hud-score">0</span></div>
            <div class="hud-item"><span class="hud-label">剩余步数</span> <span id="hud-moves">0</span></div>
            <ul id="hud-goals" class="hud-goals" aria-label="目标"></ul>
            <div class="hud-actions">
              <button id="btn-pause" type="button" class="btn icon-btn" aria-label="暂停">暂停</button>
              <button id="btn-restart" type="button" class="btn icon-btn" aria-label="重开">重开</button>
              <button id="btn-back" type="button" class="btn icon-btn" aria-label="返回选关">返回选关</button>
            </div>
            <span id="audio-badge" class="audio-badge hidden">音频不可用</span>
          </header>
        </section>

        <div id="panel-result" class="panel-layer hidden" aria-hidden="true"></div>
        <div id="panel-settings" class="panel-layer hidden" aria-hidden="true"></div>
        <div id="panel-leaderboard" class="panel-layer hidden" aria-hidden="true"></div>
        <div id="panel-pause" class="panel-layer hidden" aria-hidden="true"></div>

        <div id="game-live" aria-live="polite" aria-atomic="true" class="sr-only"></div>
        <div id="toast-root" class="toast-root" aria-live="polite"></div>
      </main>

      <noscript>需要启用 JavaScript 才能运行本游戏。</noscript>
    </div>
    <script type="module" src="/src/systems/main.ts"></script>
  </body>
</html>
